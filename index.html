<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Te amo vd</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap');

body{
    background: radial-gradient(circle at center,#001d3d 0%,
#000814 65%,
#000000 100%);
    overflow:hidden;
    width:100vw;
    height:100vh;
    font-family:'Poppins',sans-serif;
}

canvas{
    display:block;
}

#centerText{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:rgb(255, 255, 255);
    font-size:70px;
    font-weight:400;
    pointer-events:none;
    user-select:none;
    animation:pulseText 2.2s infinite ease-in-out;

    text-shadow:
    0 0 8px #c50094,
    0 0 10px #c50094,
    0 0 10px #c50094,
    0 0 20px #c50094;
}

@keyframes pulseText{
    0%,100%{
        transform:translate(-50%,-50%) scale(1);
    }
    50%{
        transform:translate(-50%,-50%) scale(1.05);
    }
}
</style>
</head>

<body>

<div id="centerText">Te amo Gatinha</div>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

window.addEventListener("resize",()=>{
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});

const particles = [];
const stars = [];

function heart(t){
    return {
        x:16*Math.pow(Math.sin(t),3),
        y:13*Math.cos(t)
         -5*Math.cos(2*t)
         -2*Math.cos(3*t)
         -Math.cos(4*t)
    };
}

// Coração
for(let i=0;i<150;i++){

    const t = Math.random()*Math.PI*2;
    const p = heart(t);

    particles.push({
        x:p.x*18,
        y:-p.y*18,
        z:(Math.random()-0.5)*170
    });

}

// Estrelas do fundo
for(let i=0;i<180;i++){
    stars.push({
        x:Math.random()*window.innerWidth,
        y:Math.random()*window.innerHeight,
        r:Math.random()*2,
        s:0.2+Math.random()*0.5
    });
}

let angle = 0;

function rotateY(x,z,a){
    return {
        x:x*Math.cos(a)-z*Math.sin(a),
        z:x*Math.sin(a)+z*Math.cos(a)
    };
}

function rotateX(y,z,a){
    return {
        y:y*Math.cos(a)-z*Math.sin(a),
        z:y*Math.sin(a)+z*Math.cos(a)
    };
}

function drawStars(){

    for(let s of stars){

        s.y += s.s;

        if(s.y > canvas.height){
            s.y = -5;
            s.x = Math.random()*canvas.width;
        }

        ctx.beginPath();
        ctx.fillStyle = "rgba(255,255,255,0.8)";
        ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
        ctx.fill();
    }

}

function animate(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    drawStars();

    angle += 0.008;

    const pulse = 1 + Math.sin(Date.now()*0.003)*0.08;

    for(let p of particles){

        let ry = rotateY(p.x,p.z,angle);

        let rx = rotateX(
            p.y,
            ry.z,
            Math.sin(angle*0.6)*0.35
        );

        const perspective = 650;
        const scale = perspective/(perspective-rx.z);

        const sx = ry.x*scale*pulse + canvas.width/2;
        const sy = rx.y*scale*pulse + canvas.height/2;

        const alpha = Math.max(0.25,scale*0.9);

        ctx.save();

        ctx.globalAlpha = alpha;
        ctx.translate(sx,sy);

        ctx.font = `${11+scale*5}px Poppins`;
        ctx.textAlign = "center";

        ctx.shadowBlur = 20;
        ctx.shadowColor = "#00aaff";

        ctx.fillStyle = "#00aaff";
        ctx.fillText("I love you",0,0);

        ctx.restore();
    }

    requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
